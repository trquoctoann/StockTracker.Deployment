global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: stocktracker-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: stocktracker-datacollector
    static_configs:
      - targets: ["datacollector:8001"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
