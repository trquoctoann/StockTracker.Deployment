groups:
  - name: stocktracker-availability
    rules:
      - alert: StockTrackerTargetDown
        expr: up{job=~"stocktracker-api|stocktracker-datacollector|postgres|redis|rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is unavailable"
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} has a sustained backlog"
      - alert: RabbitMQDeadLetterBacklog
        expr: rabbitmq_queue_messages_ready{queue=~".*\\.dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ dead-letter queue {{ $labels.queue }} requires investigation"
      - alert: DataPipelineFailed
        expr: increase(stocktracker_pipeline_runs_total{status="failed"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} failed"
      - alert: DataPipelineStale
        expr: time() - stocktracker_pipeline_last_success_timestamp_seconds > 93600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} has not succeeded for more than 26 hours"
