# Usage:
#   docker compose up -d            # Start all services
#   docker compose logs -f api      # Follow API logs
#   docker compose down             # Stop all services
#   docker compose down -v          # Stop + remove volumes (DESTRUCTIVE)

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/localhost/8080) 2>/dev/null && echo OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  api:
    build:
      context: ../StockTracker.API
      dockerfile: ../StockTracker.Deployment/services/api/Dockerfile
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_API_REPO:-stocktracker-api}:${API_APP_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-api
    restart: unless-stopped
    environment: &api-environment
      APP_NAME: ${API_APP_NAME}
      APP_VERSION: ${API_APP_VERSION}
      DEBUG: ${API_DEBUG}
      ENVIRONMENT: ${API_ENVIRONMENT}
      SERVICE_NAME: ${API_SERVICE_NAME}
      LOG_LEVEL: ${API_LOG_LEVEL}
      LOG_JSON: ${API_LOG_JSON}
      LOG_SQL: ${API_LOG_SQL}
      DATABASE_URL: ${API_DATABASE_URL}
      DATABASE_POOL_PRE_PING: ${API_DATABASE_POOL_PRE_PING}
      DATABASE_POOL_SIZE: ${API_DATABASE_POOL_SIZE}
      DATABASE_MAX_OVERFLOW: ${API_DATABASE_MAX_OVERFLOW}
      ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS}
      DEFAULT_PAGE_SIZE: ${API_DEFAULT_PAGE_SIZE}
      MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE}
      DEFAULT_LOCALE: ${API_DEFAULT_LOCALE}
      SUPPORTED_LOCALES: ${API_SUPPORTED_LOCALES}
      OIDC_KEYCLOAK_SERVER_URL: ${API_OIDC_KEYCLOAK_SERVER_URL}
      OIDC_KEYCLOAK_REALM: ${API_OIDC_KEYCLOAK_REALM}
      OIDC_KEYCLOAK_CLIENT_ID: ${API_OIDC_KEYCLOAK_CLIENT_ID}
      OIDC_KEYCLOAK_CLIENT_SECRET: ${API_OIDC_KEYCLOAK_CLIENT_SECRET}
      OIDC_KEYCLOAK_ADMIN_USERNAME: ${API_OIDC_KEYCLOAK_ADMIN_USERNAME}
      OIDC_KEYCLOAK_ADMIN_PASSWORD: ${API_OIDC_KEYCLOAK_ADMIN_PASSWORD}
      OIDC_KEYCLOAK_VERIFY_TLS: ${API_OIDC_KEYCLOAK_VERIFY_TLS}
      AUTH_CONTEXT_TOKEN_SECRET: ${API_AUTH_CONTEXT_TOKEN_SECRET}
      AUTH_CONTEXT_TOKEN_ALGORITHM: ${API_AUTH_CONTEXT_TOKEN_ALGORITHM}
      AUTH_CONTEXT_TOKEN_TTL_SECONDS: ${API_AUTH_CONTEXT_TOKEN_TTL_SECONDS}
      AUTH_CONTEXT_TOKEN_ISSUER: ${API_AUTH_CONTEXT_TOKEN_ISSUER}
      REDIS_ENABLED: ${API_REDIS_ENABLED}
      REDIS_URL: ${API_REDIS_URL}
      REDIS_MAX_CONNECTIONS: ${API_REDIS_MAX_CONNECTIONS}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${API_REDIS_SOCKET_CONNECT_TIMEOUT}
      REDIS_SOCKET_TIMEOUT: ${API_REDIS_SOCKET_TIMEOUT}
      REDIS_KEY_PREFIX: ${API_REDIS_KEY_PREFIX}
      REDIS_KEY_SERVICE_PREFIX: ${API_REDIS_KEY_SERVICE_PREFIX}
      REDIS_DEFAULT_TTL_SECONDS: ${API_REDIS_DEFAULT_TTL_SECONDS}
      REDIS_CIRCUIT_BREAKER_SECONDS: ${API_REDIS_CIRCUIT_BREAKER_SECONDS}
      RABBITMQ_ENABLED: ${API_RABBITMQ_ENABLED}
      RABBITMQ_CONSUMER_ENABLED: "false"
      RABBITMQ_URL: ${API_RABBITMQ_URL}
      RABBITMQ_EXCHANGE_NAME: ${API_RABBITMQ_EXCHANGE_NAME}
      RABBITMQ_EXCHANGE_TYPE: ${API_RABBITMQ_EXCHANGE_TYPE}
      RABBITMQ_PREFETCH_COUNT: ${API_RABBITMQ_PREFETCH_COUNT}
      RABBITMQ_RECONNECT_DELAY_SECONDS: ${API_RABBITMQ_RECONNECT_DELAY_SECONDS}
      RABBITMQ_MAX_RETRIES: ${API_RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_RETRY_DELAY_MS: ${API_RABBITMQ_RETRY_DELAY_MS:-30000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend
    labels:
      logging: "true"

  api-worker:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_API_REPO:-stocktracker-api}:${API_APP_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-api-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-environment
      SERVICE_NAME: ${API_SERVICE_NAME:-API}-worker
      RABBITMQ_CONSUMER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # The shared API image probes an HTTP server that this worker does not run.
    # Probe the dependencies from the worker container so `compose --wait` can
    # distinguish a ready consumer process from one with broken connectivity.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; endpoints=(('postgres', 5432), ('redis', 6379), ('rabbitmq', 5672)); [socket.create_connection(endpoint, 2).close() for endpoint in endpoints]"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend
    labels:
      logging: "true"

  postgres-backup:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres-backup
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    command: ["/scripts/backup.sh"]
    volumes:
      - ./scripts/postgres:/scripts:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    labels:
      logging: "true"

  s3mock:
    image: adobe/s3mock:5.1.0
    container_name: ${COMPOSE_PROJECT_NAME}-s3mock
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${RAW_ARCHIVE_BUCKET:-stocktracker-raw}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  datacollector:
    build:
      context: ../StockTracker.DataCollector
      dockerfile: ../StockTracker.Deployment/services/datacollector/Dockerfile
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_DATACOLLECTOR_REPO:-stocktracker-datacollector}:${DATACOLLECTOR_APP_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-datacollector
    restart: unless-stopped
    environment:
      LOG_JSON: ${DATACOLLECTOR_LOG_JSON}
      STOCKTRACKER_API_BASE_URL: ${DATACOLLECTOR_API_BASE_URL}
      KEYCLOAK_BASE_URL: ${DATACOLLECTOR_KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${DATACOLLECTOR_KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${DATACOLLECTOR_KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${DATACOLLECTOR_KEYCLOAK_CLIENT_SECRET}
      HTTP_TIMEOUT_SECONDS: ${DATACOLLECTOR_HTTP_TIMEOUT_SECONDS}
      RABBITMQ_ENABLED: ${DATACOLLECTOR_RABBITMQ_ENABLED}
      RABBITMQ_URL: ${DATACOLLECTOR_RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${DATACOLLECTOR_RABBITMQ_EXCHANGE}
      RABBITMQ_EXCHANGE_TYPE: ${DATACOLLECTOR_RABBITMQ_EXCHANGE_TYPE}
      CONTROL_PLANE_ENABLED: ${DATACOLLECTOR_CONTROL_PLANE_ENABLED:-true}
      CONTROL_DATABASE_URL: ${DATACOLLECTOR_CONTROL_DATABASE_URL:-${API_DATABASE_URL}}
      PIPELINE_HEARTBEAT_SECONDS: ${DATACOLLECTOR_PIPELINE_HEARTBEAT_SECONDS:-30}
      PIPELINE_STALE_AFTER_SECONDS: ${DATACOLLECTOR_PIPELINE_STALE_AFTER_SECONDS:-300}
      RAW_ARCHIVE_ENABLED: ${DATACOLLECTOR_RAW_ARCHIVE_ENABLED:-true}
      RAW_ARCHIVE_ENDPOINT_URL: ${DATACOLLECTOR_RAW_ARCHIVE_ENDPOINT_URL:-http://s3mock:9090}
      RAW_ARCHIVE_ACCESS_KEY: ${DATACOLLECTOR_RAW_ARCHIVE_ACCESS_KEY:-local}
      RAW_ARCHIVE_SECRET_KEY: ${DATACOLLECTOR_RAW_ARCHIVE_SECRET_KEY:-local-secret}
      RAW_ARCHIVE_REGION: ${DATACOLLECTOR_RAW_ARCHIVE_REGION:-us-east-1}
      RAW_ARCHIVE_BUCKET: ${RAW_ARCHIVE_BUCKET:-stocktracker-raw}
      RAW_ARCHIVE_PREFIX: ${DATACOLLECTOR_RAW_ARCHIVE_PREFIX:-raw}
      RAW_ARCHIVE_SCHEMA_VERSION: ${DATACOLLECTOR_RAW_ARCHIVE_SCHEMA_VERSION:-1}
      SCHEDULER_ENABLED: ${DATACOLLECTOR_SCHEDULER_ENABLED}
      SCHEDULER_TIMEZONE: ${DATACOLLECTOR_SCHEDULER_TIMEZONE:-Asia/Ho_Chi_Minh}
      VNSTOCK_LISTING_SOURCE: ${DATACOLLECTOR_VNSTOCK_LISTING_SOURCE:-KBS}
      VNSTOCK_INDICES_SOURCE: ${DATACOLLECTOR_VNSTOCK_INDICES_SOURCE:-KBS}
      VNSTOCK_COMPANY_SOURCE: ${DATACOLLECTOR_VNSTOCK_COMPANY_SOURCE:-KBS}
      VNSTOCK_QUOTE_SOURCE: ${DATACOLLECTOR_VNSTOCK_QUOTE_SOURCE:-KBS}
      VNSTOCK_HISTORY_LOOKBACK_DAYS: ${DATACOLLECTOR_VNSTOCK_HISTORY_LOOKBACK_DAYS:-30}
      VNSTOCK_PRICE_HISTORY_INTERVAL: ${DATACOLLECTOR_VNSTOCK_PRICE_HISTORY_INTERVAL:-1D}
      VNSTOCK_INTRADAY_PAGE_SIZE: ${DATACOLLECTOR_VNSTOCK_INTRADAY_PAGE_SIZE:-100}
      VNSTOCK_INTRADAY_MAX_PAGES: ${DATACOLLECTOR_VNSTOCK_INTRADAY_MAX_PAGES:-1}
      RATE_LIMIT_VNSTOCK_PER_SECOND: ${DATACOLLECTOR_RATE_LIMIT_VNSTOCK_PER_SECOND:-0.25}
      RATE_LIMIT_VNSTOCK_BURST: ${DATACOLLECTOR_RATE_LIMIT_VNSTOCK_BURST:-1}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend
    labels:
      logging: "true"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: ${COMPOSE_PROJECT_NAME}-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.89.0-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ${COMPOSE_PROJECT_NAME}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: ${COMPOSE_PROJECT_NAME}-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.1
    container_name: ${COMPOSE_PROJECT_NAME}-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      # Loki's production image is distroless, so CMD-SHELL/wget are unavailable.
      # HTTP readiness is covered by the deployment smoke test.
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki-config.yml", "-verify-config"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.15.0
    container_name: ${COMPOSE_PROJECT_NAME}-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring
      - backend

  grafana:
    image: grafana/grafana:12.4.2
    container_name: ${COMPOSE_PROJECT_NAME}-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - monitoring

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME}-backend
    driver: bridge
  monitoring:
    name: ${COMPOSE_PROJECT_NAME}-monitoring
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}-redis-data
  rabbitmq_data:
    name: ${COMPOSE_PROJECT_NAME}-rabbitmq-data
  loki_data:
    name: ${COMPOSE_PROJECT_NAME}-loki-data
  alloy_data:
    name: ${COMPOSE_PROJECT_NAME}-alloy-data
  grafana_data:
    name: ${COMPOSE_PROJECT_NAME}-grafana-data
  prometheus_data:
    name: ${COMPOSE_PROJECT_NAME}-prometheus-data
  alertmanager_data:
    name: ${COMPOSE_PROJECT_NAME}-alertmanager-data
  postgres_backups:
    name: ${COMPOSE_PROJECT_NAME}-postgres-backups
  s3mock_data:
    name: ${COMPOSE_PROJECT_NAME}-s3mock-data
