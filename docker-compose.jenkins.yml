# Usage:
#   docker compose -f docker-compose.jenkins.yml up -d

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: stocktracker-jenkins:lts
    container_name: ${COMPOSE_PROJECT_NAME:-stocktracker}-jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env}
      DOCKER_HOST: tcp://docker:2375
    ports:
      - "127.0.0.1:9090:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_home/casc:ro
    depends_on:
      docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G

  docker:
    image: docker:28-dind
    container_name: ${COMPOSE_PROJECT_NAME:-stocktracker}-jenkins-docker
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:9091:9091"
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_docker_data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "--host=tcp://localhost:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  jenkins_home:
    name: ${COMPOSE_PROJECT_NAME:-stocktracker}-jenkins-home
  jenkins_docker_data:
    name: ${COMPOSE_PROJECT_NAME:-stocktracker}-jenkins-docker-data
